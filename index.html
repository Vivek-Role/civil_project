    /**
     * RENDER PRESENTATION SLIDE VIEW (Generous Centered Slide Canvas max-w-4xl)
     */
    function renderPresentationView(viewport) {
      const chap = CHAPTERS[appState.chapterIndex];
      const slide = chap.slides[appState.slideIndex];
      const totalSlides = chap.slides.length;
      const isFirstOverall = appState.chapterIndex === 0 && appState.slideIndex === 0;
      const isLastInChapter = appState.slideIndex === totalSlides - 1;
      const isLastOverall = appState.chapterIndex === CHAPTERS.length - 1 && isLastInChapter;

      // Update Bottom Presentation Footer Controls
      const footer = document.getElementById('presentation-footer');
      footer.classList.remove('hidden');

      document.getElementById('slide-counter-text').textContent = `Slide ${appState.slideIndex + 1} of ${totalSlides}`;

      const prevBtn = document.getElementById('btn-prev-slide');
      if (isFirstOverall) {
        prevBtn.disabled = true;
        prevBtn.className = 'px-4 py-2 rounded-lg text-xs sm:text-sm font-medium border border-slate-200 text-slate-300 cursor-not-allowed min-h-[40px]';
      } else {
        prevBtn.disabled = false;
        prevBtn.className = 'px-4 py-2 rounded-lg text-xs sm:text-sm font-medium border border-slate-300 bg-white hover:bg-slate-50 text-slate-700 transition cursor-pointer min-h-[40px]';
      }

      const nextLabel = document.getElementById('btn-next-label');
      if (isLastOverall) {
        nextLabel.textContent = 'Finish & Return Home →';
      } else if (isLastInChapter) {
        nextLabel.textContent = 'Next Topic →';
      } else {
        nextLabel.textContent = 'Next →';
      }

      // Render Slide Canvas
      viewport.innerHTML = `
        <div class="flex-1 flex flex-col justify-center py-8 sm:py-12">
          <div class="w-full max-w-4xl mx-auto px-4 sm:px-8 view-fade-enter">
            
            <!-- Slide Eyebrow & Heading -->
            <div class="mb-7">
              <div class="font-mono text-xs uppercase tracking-widest text-[#B45309] font-semibold mb-2">
                ${slide.eyebrow}
              </div>
              <h1 class="text-2xl sm:text-4xl font-extrabold text-slate-900 tracking-tight">
                ${slide.title}
              </h1>
            </div>

            <!-- Slide Content -->
            <div>
              ${slide.render()}
            </div>

          </div>
        </div>
      `;
    }

      if (appState.view === 'home') {

    }

      const modal = document.getElementById('code-export-modal');

      document.getElementById('copy-code-btn-label').textContent = 'Copy Code';

    function switchCodeTab(tab) {
      appState.activeCodeTab = tab;
      const htmlTabBtn = document.getElementById('tab-code-html');
      const cssTabBtn = document.getElementById('tab-code-css');
      const helper = document.getElementById('code-tab-helper');
      const codeContainer = document.getElementById('code-snippet-container');

      document.getElementById('copy-feedback-text').classList.add('opacity-0');
      document.getElementById('copy-code-btn-label').textContent = 'Copy Code';

      if (tab === 'html') {
        htmlTabBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-mono font-semibold bg-white text-[#0F3D6E] shadow-xs transition cursor-pointer';

        helper.innerHTML = 'This complete, dependency-free single-file <code class="font-mono bg-slate-100 px-1.5 py-0.5 rounded text-slate-800">index.html</code> includes the Home page, all 7 project chapters, and architectural SVG schematics.';
        codeContainer.textContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
      } else {
        cssTabBtn.className = 'px-3.5 py-1.5 rounded-lg text-xs font-mono font-semibold bg-white text-[#0F3D6E] shadow-xs transition cursor-pointer';

        codeContainer.textContent = DESIGN_TOKENS_CSS;
      }
    }

    function copyActiveCodeSnippet() {
      const codeText = document.getElementById('code-snippet-container').textContent;
      const tempArea = document.createElement('textarea');
      tempArea.value = codeText;
      tempArea.style.position = 'fixed';
      tempArea.style.left = '-9999px';
      document.body.appendChild(tempArea);
      tempArea.select();
      try {
        document.execCommand('copy');
        document.getElementById('copy-feedback-text').classList.remove('opacity-0');
        document.getElementById('copy-code-btn-label').textContent = 'Copied!';
      } catch (err) {
        // Fallback handled silently
      }
      document.body.removeChild(tempArea);
    }

    // Close modal on backdrop click
    document.getElementById('code-export-modal').addEventListener('click', (e) => {
      if (e.target.id === 'code-export-modal') closeCodeModal();
    });
